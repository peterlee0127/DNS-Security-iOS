<script type="application/ld+json">
[
  {
    "@context": "https://schema.org",
    "@type": "MobileApplication",
    "name": "DNS Security Lite",
    "operatingSystem": "iOS, iPadOS, macOS",
    "applicationCategory": "UtilitiesApplication",
    "description": {{ site.description | jsonify }},
    "image": {{ '/assets/icons/dns-security.png' | absolute_url | jsonify }},
    "url": {{ site.app_store.lite | jsonify }},
    "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
  },
  {
    "@context": "https://schema.org",
    "@type": "MobileApplication",
    "name": "DNS Security Pro",
    "operatingSystem": "iOS, iPadOS, macOS",
    "applicationCategory": "UtilitiesApplication",
    "description": {{ site.description | jsonify }},
    "image": {{ '/assets/icons/dns-security-pro.png' | absolute_url | jsonify }},
    "url": {{ site.app_store.pro | jsonify }}
  },
  {
    "@context": "https://schema.org",
    "@type": "FAQPage",
    "mainEntity": [
      {% for item in site.data.faq %}{
        "@type": "Question",
        "name": {{ item.q | jsonify }},
        "acceptedAnswer": { "@type": "Answer", "text": {{ item.a | jsonify }} }
      }{% unless forloop.last %},{% endunless %}
      {% endfor %}
    ]
  }
]
</script>
